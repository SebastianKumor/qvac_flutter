name: qvac_flutter
description: "Unofficial Flutter plugin for QVAC, Tether's local AI. On-device speech to text with Whisper on iOS and Android."
version: 0.2.0
repository: https://github.com/SebastianKumor/qvac_flutter
issue_tracker: https://github.com/SebastianKumor/qvac_flutter/issues
topics:
  - speech-to-text
  - whisper
  - on-device-ai
  - offline

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: tech.velorion.qvac_flutter
        pluginClass: QvacFlutterPlugin
      ios:
        pluginClass: QvacFlutterPlugin

